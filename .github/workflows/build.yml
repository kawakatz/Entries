name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-x64:
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v6
      - uses: microsoft/setup-msbuild@v3
        with:
          msbuild-architecture: x64
      - run: msbuild Entries.sln /m /t:Build /p:Configuration=Release /p:Platform=x64
      - run: .\x64\Release\Entries.exe --help
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v7
        with:
          name: Entries-${{ github.ref_name }}-x64
          path: x64/Release/Entries.exe
          if-no-files-found: error
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-x64
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: Entries-${{ github.ref_name }}-x64
      - env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" Entries.exe --verify-tag
          --title "$GITHUB_REF_NAME" --generate-notes
